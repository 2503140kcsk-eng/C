name: Lean proof check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain and build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: true
      - name: Show Lean version
        run: lean --version
      - name: Check standalone formalization
        run: lake env lean HakuiKoyori.lean
