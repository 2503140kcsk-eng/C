name: Lean proof check

on:
  push:
    branches: [main, "m1/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: false
      - name: Resolve pinned Lake dependencies
        run: lake update
      - name: Build and audit
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: HakuiKoyori
      - name: Show Lean version
        run: lean --version
      - name: Check standalone formalization
        run: lake env lean HakuiKoyori.lean
      - name: Check machine formalization
        run: lake env lean AssistantMachine.lean
