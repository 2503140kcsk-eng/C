name: Lean proof check

on:
  push:
    branches: [main, "m1/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          axiom-audit: false
      - name: Resolve pinned Lake dependencies
        run: lake update
      - name: Build and audit
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: HakuiKoyori
      - name: Show Lean version
        run: lean --version
      - name: Check standalone formalization
        run: lake env lean HakuiKoyori.lean
      - name: Check machine formalization
        run: lake env lean HakuiKoyori/AssistantMachine.lean
      - name: Check simulation infrastructure
        run: lake env lean HakuiKoyori/Simulation.lean
      - name: Check compiler foundations
        run: lake env lean HakuiKoyori/CompilerCore.lean
      - name: Check concrete low-level macros
        run: lake env lean HakuiKoyori/LowLevelMacros.lean
      - name: Check MUL and TR macro semantics
        run: lake env lean HakuiKoyori/MacroSemantics.lean
      - name: Check macro-boundary simulation
        run: lake env lean HakuiKoyori/BoundarySimulation.lean
      - name: Check TM stack arithmetic semantics
        run: lake env lean HakuiKoyori/StackSemantics.lean
      - name: Check finite typed Turing machine semantics
        run: lake env lean HakuiKoyori/FiniteTM.lean
      - name: Check primitive MUL execution
        run: lake env lean HakuiKoyori/PrimitiveMacroRuns.lean
      - name: Check primitive TR execution
        run: lake env lean HakuiKoyori/PrimitiveTransferRuns.lean
      - name: Check primitive DIVREM tail execution
        run: lake env lean HakuiKoyori/PrimitiveDivRemRuns.lean
      - name: Check emitted-program lookup semantics
        run: lake env lean HakuiKoyori/EmissionSemantics.lean
